<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseDot { 0%, 100% { opacity: 0.4; r: 2.5; } 50% { opacity: 1; r: 4; } }
      .p-dot { animation: pulseDot 2s infinite ease-in-out; }
      .dot-1 { animation-delay: 0s; }
      .dot-2 { animation-delay: 0.7s; }
    </style>
    <pattern id="grid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#18231d" stroke-width="0.75"/>
    </pattern>
    <linearGradient id="samvadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#09120e"/>
  <rect width="600" height="400" fill="url(#grid4)"/>

  <!-- Header -->
  <rect x="25" y="20" width="550" height="30" fill="#0d1f17" stroke="#164e37" stroke-width="1" rx="4"/>
  <text x="40" y="39" fill="#34d399" font-family="monospace" font-size="10" letter-spacing="1.5">SYS_PLATFORM // SAMVAD · REAL-TIME COMMUNICATION ENGINE</text>
  <circle cx="490" cy="35" r="3" fill="#34d399" class="p-dot dot-1"/>
  <text x="500" y="39" fill="#34d399" font-family="monospace" font-size="9" letter-spacing="1">ONLINE</text>

  <!-- Clients Layer -->
  <rect x="45" y="65" width="145" height="110" fill="#0d241c" stroke="#059669" stroke-width="1" rx="4"/>
  <text x="55" y="85" fill="#6ee7b7" font-family="monospace" font-size="9.5" font-weight="bold">DISTRIBUTED CLIENTS</text>
  <text x="55" y="105" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Concurrent Users</text>
  <text x="55" y="122" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Active Channel Rooms</text>
  <text x="55" y="139" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Reactive UI State</text>
  <text x="55" y="156" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Real-time Presence</text>

  <!-- Flow Line -->
  <path d="M 190 120 L 225 120" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="207" cy="120" r="2.5" fill="#10b981" class="p-dot dot-1"/>

  <!-- Real-Time Event Broker -->
  <rect x="225" y="65" width="170" height="110" fill="#0d241c" stroke="#10b981" stroke-width="1" rx="4"/>
  <text x="235" y="85" fill="#a7f3d0" font-family="monospace" font-size="9.5" font-weight="bold">EVENT BROKER</text>
  <text x="235" y="105" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Low-Latency Dispatcher</text>
  <text x="235" y="122" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Multi-Room Message Fanout</text>
  <text x="235" y="139" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Socket Stream Serialization</text>
  <text x="235" y="156" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Heartbeat &amp; Auto-reconnect</text>

  <!-- Flow Line -->
  <path d="M 395 120 L 430 120" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="412" cy="120" r="2.5" fill="#10b981" class="p-dot dot-2"/>

  <!-- Next.js App Interface -->
  <rect x="430" y="65" width="125" height="110" fill="#0d241c" stroke="#047857" stroke-width="1" rx="4"/>
  <text x="440" y="85" fill="#6ee7b7" font-family="monospace" font-size="9.5" font-weight="bold">REACT 19 UI</text>
  <text x="440" y="105" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Next.js 16</text>
  <text x="440" y="122" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Geist Font</text>
  <text x="440" y="139" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Modern UI</text>
  <text x="440" y="156" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Responsive</text>

  <!-- Architecture Stack Box -->
  <rect x="45" y="195" width="510" height="145" fill="url(#samvadGrad)" stroke="#134e40" stroke-width="1" rx="6"/>
  <text x="65" y="220" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="bold">LOW-LATENCY COLLABORATION ARCHITECTURE</text>

  <!-- Component Tree -->
  <rect x="65" y="235" width="235" height="85" fill="#081712" stroke="#059669" stroke-width="1" rx="4"/>
  <text x="75" y="255" fill="#6ee7b7" font-family="monospace" font-size="9.5" font-weight="bold">WORKSPACE INTEGRATION</text>
  <text x="75" y="275" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Clean decoupled component layout</text>
  <text x="75" y="292" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Zero runtime CSS overhead</text>
  <text x="75" y="308" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Native TypeScript type safety</text>

  <!-- Web Standards -->
  <rect x="315" y="235" width="220" height="85" fill="#081712" stroke="#047857" stroke-width="1" rx="4"/>
  <text x="325" y="255" fill="#34d399" font-family="monospace" font-size="9.5" font-weight="bold">NEXT-GEN WEB STACK</text>
  <text x="325" y="275" fill="#94a3b8" font-family="monospace" font-size="8.5">Server-side rendering optimization</text>
  <text x="325" y="292" fill="#94a3b8" font-family="monospace" font-size="8.5">Low latency WebSocket bridge</text>
  <text x="325" y="308" fill="#94a3b8" font-family="monospace" font-size="8.5">Engineered for interactive dialogue</text>

  <!-- Footer -->
  <text x="25" y="380" fill="#334155" font-family="monospace" font-size="8.5">STACK // NEXT.JS 16 · REACT 19 · TYPESCRIPT · LOW-LATENCY REAL-TIME COLLABORATION</text>
</svg>
