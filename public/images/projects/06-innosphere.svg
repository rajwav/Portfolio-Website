<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseDot { 0%, 100% { opacity: 0.4; r: 2.5; } 50% { opacity: 1; r: 4; } }
      .p-dot { animation: pulseDot 2s infinite ease-in-out; }
      .dot-1 { animation-delay: 0s; }
      .dot-2 { animation-delay: 0.7s; }
    </style>
    <pattern id="grid6" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#221b2b" stroke-width="0.75"/>
    </pattern>
    <linearGradient id="innoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#0d0a14"/>
  <rect width="600" height="400" fill="url(#grid6)"/>

  <!-- Header -->
  <rect x="25" y="20" width="550" height="30" fill="#150f21" stroke="#362254" stroke-width="1" rx="4"/>
  <text x="40" y="39" fill="#c084fc" font-family="monospace" font-size="10" letter-spacing="1.5">FUTURE_VISION // INNOSPHERE · DEEP-TECH &amp; AUTONOMOUS SYSTEMS</text>
  <circle cx="490" cy="35" r="3" fill="#c084fc" class="p-dot dot-1"/>
  <text x="500" y="39" fill="#c084fc" font-family="monospace" font-size="9" letter-spacing="1">HORIZON</text>

  <!-- AI & Intelligence Column -->
  <rect x="45" y="65" width="145" height="110" fill="#181026" stroke="#7c3aed" stroke-width="1" rx="4"/>
  <text x="55" y="85" fill="#d8b4fe" font-family="monospace" font-size="9.5" font-weight="bold">AUTONOMOUS AI</text>
  <text x="55" y="105" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Multi-agent Planning</text>
  <text x="55" y="122" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Cognitive World Models</text>
  <text x="55" y="139" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Edge Neural Accelerators</text>
  <text x="55" y="156" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Self-Directed Systems</text>

  <!-- Flow Line -->
  <path d="M 190 120 L 225 120" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="207" cy="120" r="2.5" fill="#a855f7" class="p-dot dot-1"/>

  <!-- Robotics & Physical Systems -->
  <rect x="225" y="65" width="170" height="110" fill="#181026" stroke="#9333ea" stroke-width="1" rx="4"/>
  <text x="235" y="85" fill="#e9d5ff" font-family="monospace" font-size="9.5" font-weight="bold">ROBOTICS &amp; HARDWARE</text>
  <text x="235" y="105" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Kinematic Actuation Loops</text>
  <text x="235" y="122" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Sensor Fusion &amp; Telemetry</text>
  <text x="235" y="139" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Spatial Mapping &amp; Vision</text>
  <text x="235" y="156" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Real-world Feedback</text>

  <!-- Flow Line -->
  <path d="M 395 120 L 430 120" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="412" cy="120" r="2.5" fill="#a855f7" class="p-dot dot-2"/>

  <!-- Frontier Tech -->
  <rect x="430" y="65" width="125" height="110" fill="#181026" stroke="#c026d3" stroke-width="1" rx="4"/>
  <text x="440" y="85" fill="#f0abfc" font-family="monospace" font-size="9.5" font-weight="bold">FRONTIER TECH</text>
  <text x="440" y="105" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Space Telemetry</text>
  <text x="440" y="122" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Distributed Mesh</text>
  <text x="440" y="139" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Physical Compute</text>
  <text x="440" y="156" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Human Interfaces</text>

  <!-- Long-Term Vision Box -->
  <rect x="45" y="195" width="510" height="145" fill="url(#innoGrad)" stroke="#4c1d95" stroke-width="1" rx="6"/>
  <text x="65" y="220" fill="#f5f3ff" font-family="monospace" font-size="11" font-weight="bold">LONG-TERM FOUNDER INITIATIVE &amp; DEEP-TECH HORIZON</text>

  <!-- Core Thesis -->
  <rect x="65" y="235" width="235" height="85" fill="#100a1c" stroke="#6d28d9" stroke-width="1" rx="4"/>
  <text x="75" y="255" fill="#d8b4fe" font-family="monospace" font-size="9.5" font-weight="bold">CORE RESEARCH VISION</text>
  <text x="75" y="275" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Bridging algorithmic AI &amp; physical reality</text>
  <text x="75" y="292" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Building ambitious, high-impact systems</text>
  <text x="75" y="308" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ First-principles engineering foundation</text>

  <!-- Engineering Discipline -->
  <rect x="315" y="235" width="220" height="85" fill="#100a1c" stroke="#7e22ce" stroke-width="1" rx="4"/>
  <text x="325" y="255" fill="#c084fc" font-family="monospace" font-size="9.5" font-weight="bold">FOUNDATION &amp; EVOLUTION</text>
  <text x="325" y="275" fill="#94a3b8" font-family="monospace" font-size="8.5">Learning deeply by building real tools</text>
  <text x="325" y="292" fill="#94a3b8" font-family="monospace" font-size="8.5">Starting with software, expanding to hardware</text>
  <text x="325" y="308" fill="#94a3b8" font-family="monospace" font-size="8.5">Laying groundwork for future innovations</text>

  <!-- Footer -->
  <text x="25" y="380" fill="#475569" font-family="monospace" font-size="8.5">VISION // INNOSPHERE INITIATIVE · DEEP-TECH RESEARCH &amp; AUTONOMOUS SYSTEMS DIRECTION</text>
</svg>
