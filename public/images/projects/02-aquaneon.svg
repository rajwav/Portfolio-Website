<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseDot { 0%, 100% { opacity: 0.4; r: 2.5; } 50% { opacity: 1; r: 4; } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -40; } }
      .p-dot { animation: pulseDot 2s infinite ease-in-out; }
      .dot-1 { animation-delay: 0s; }
      .dot-2 { animation-delay: 0.7s; }
      .wave-line { stroke-dasharray: 8, 4; animation: waveScroll 3s linear infinite; }
    </style>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#132326" stroke-width="0.75"/>
    </pattern>
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#080f12"/>
  <rect width="600" height="400" fill="url(#grid2)"/>

  <!-- Header -->
  <rect x="25" y="20" width="550" height="30" fill="#0c171c" stroke="#163840" stroke-width="1" rx="4"/>
  <text x="40" y="39" fill="#22d3ee" font-family="monospace" font-size="10" letter-spacing="1.5">SYS_PIPELINE // AQUANEON · WATER INTELLIGENCE &amp; SCADA</text>
  <circle cx="485" cy="35" r="3" fill="#22d3ee" class="p-dot dot-1"/>
  <text x="495" y="39" fill="#22d3ee" font-family="monospace" font-size="9" letter-spacing="1">LIVE_FEED</text>

  <!-- Ingestion Waveform Section -->
  <rect x="45" y="65" width="145" height="110" fill="#0b1a20" stroke="#0e7490" stroke-width="1" rx="4"/>
  <text x="55" y="85" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold">TELEMETRY STREAM</text>
  <path d="M 55 130 Q 75 100 95 130 T 135 130 T 175 130" fill="none" stroke="#06b6d4" stroke-width="1.5" class="wave-line"/>
  <text x="55" y="155" fill="#64748b" font-family="monospace" font-size="8">pH · Turbidity · TDS · DO</text>
  <text x="55" y="167" fill="#64748b" font-family="monospace" font-size="8">Multivariate Sensors</text>

  <!-- Flow Line -->
  <path d="M 190 120 L 225 120" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="207" cy="120" r="2.5" fill="#06b6d4" class="p-dot dot-1"/>

  <!-- 5-Model Pipeline -->
  <rect x="225" y="65" width="170" height="110" fill="#0b1a20" stroke="#0284c7" stroke-width="1" rx="4"/>
  <text x="235" y="85" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold">5-MODEL ML ENGINE</text>
  <text x="235" y="105" fill="#94a3b8" font-family="monospace" font-size="8">▸ Isolation Forest (Anomaly)</text>
  <text x="235" y="120" fill="#94a3b8" font-family="monospace" font-size="8">▸ Balanced Random Forest</text>
  <text x="235" y="135" fill="#94a3b8" font-family="monospace" font-size="8">▸ HistGradientBoost (24h)</text>
  <text x="235" y="150" fill="#94a3b8" font-family="monospace" font-size="8">▸ Biological Eco-Health Index</text>

  <!-- Flow Line -->
  <path d="M 395 120 L 430 120" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="412" cy="120" r="2.5" fill="#06b6d4" class="p-dot dot-2"/>

  <!-- TreeSHAP Explainability -->
  <rect x="430" y="65" width="125" height="110" fill="#0b1a20" stroke="#059669" stroke-width="1" rx="4"/>
  <text x="440" y="85" fill="#34d399" font-family="monospace" font-size="9.5" font-weight="bold">TreeSHAP XAI</text>
  <!-- Mini Bar Chart -->
  <rect x="440" y="100" width="60" height="6" fill="#059669" rx="2"/>
  <rect x="440" y="112" width="80" height="6" fill="#10b981" rx="2"/>
  <rect x="440" y="124" width="45" height="6" fill="#34d399" rx="2"/>
  <text x="440" y="150" fill="#94a3b8" font-family="monospace" font-size="8">Local Attributions</text>
  <text x="440" y="163" fill="#94a3b8" font-family="monospace" font-size="8">Neuro-Symbolic Gate</text>

  <!-- SCADA Digital Twin Box -->
  <rect x="45" y="195" width="510" height="145" fill="url(#aquaGrad)" stroke="#164e63" stroke-width="1" rx="6"/>
  <text x="65" y="220" fill="#e0f2fe" font-family="monospace" font-size="11" font-weight="bold">SCADA DIGITAL TWIN MITIGATION SYSTEM</text>

  <!-- SCADA Actuators -->
  <rect x="65" y="235" width="235" height="85" fill="#081419" stroke="#0891b2" stroke-width="1" rx="4"/>
  <text x="75" y="255" fill="#67e8f9" font-family="monospace" font-size="9.5" font-weight="bold">CLOSED-LOOP ACTUATION</text>
  <text x="75" y="275" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Valve 01: Flocculation Rate</text>
  <text x="75" y="292" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Valve 02: Aeration Pressure</text>
  <text x="75" y="308" fill="#94a3b8" font-family="monospace" font-size="8.5">▸ Automated Chemical Dosing</text>

  <!-- Simulation Sandbox -->
  <rect x="315" y="235" width="220" height="85" fill="#081419" stroke="#0284c7" stroke-width="1" rx="4"/>
  <text x="325" y="255" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold">INTERACTIVE SIMULATOR</text>
  <text x="325" y="275" fill="#94a3b8" font-family="monospace" font-size="8.5">Real-time hydraulic fault injection</text>
  <text x="325" y="292" fill="#94a3b8" font-family="monospace" font-size="8.5">FastAPI Backend + Streamlit UI</text>
  <text x="325" y="308" fill="#10b981" font-family="monospace" font-size="8.5">Live Render Deployment Online</text>

  <!-- Footer -->
  <text x="25" y="380" fill="#334155" font-family="monospace" font-size="8.5">ENV // FASTAPI · SCIKIT-LEARN · TREESHAP · DIGITAL TWIN · STREAMLIT DEPLOYED</text>
</svg>
